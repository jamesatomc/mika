[package]
name = "mika-core"
edition.workspace = true
categories.workspace = true
keywords.workspace = true
homepage.workspace = true
documentation.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[dependencies]
mika-types = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
hex = { workspace = true }
bcs = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
kanari-types = { workspace = true }
kanari-crypto = { workspace = true }
move-core-types = { workspace = true }
kanari-core = { workspace = true, optional = true }
kanari-common = { workspace = true, optional = true }
kanari-rpc-client = { workspace = true, optional = true }
kanari-rpc-api = { workspace = true, optional = true }
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }
fjall = { workspace = true }
reqwest = { workspace = true, optional = true }
tempfile = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
rand = { workspace = true }

[features]
default = []
onchain = ["kanari-core", "kanari-common", "kanari-rpc-client", "kanari-rpc-api", "reqwest"]
